name: MyGraph
options:
  bundleIdPrefix: app.mygraph
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Change these three for your Apple Developer account (see README.md).
settings:
  base:
    BUNDLE_ID: app.mygraph.ios
    APP_GROUP: group.app.mygraph.ios
    DEVELOPMENT_TEAM: ""
    WEB_DOMAIN: web-production-1858e.up.railway.app
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  MyGraph:
    type: application
    platform: iOS
    sources:
      - path: MyGraph
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        PRODUCT_NAME: MyGraph
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: MyGraph/Info.plist
      properties:
        CFBundleDisplayName: My Graph
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, da]
        CFBundleAllowMixedLocalizations: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        MGAppGroup: $(APP_GROUP)
        MGRefreshTask: $(BUNDLE_ID).refresh
        BGTaskSchedulerPermittedIdentifiers: [$(BUNDLE_ID).refresh]
        UIBackgroundModes: [fetch]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Take a photo of a letter or note to add it to your library.
        NSPhotoLibraryUsageDescription: Choose photos to add to your library.
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID)
            CFBundleURLSchemes: [mygraph]
    entitlements:
      path: MyGraph/MyGraph.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
        com.apple.developer.associated-domains: [webcredentials:$(WEB_DOMAIN)]
    dependencies:
      - target: MyGraphShare
      - target: MyGraphWidget

  MyGraphShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
      - path: MyGraph/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).share
        PRODUCT_NAME: MyGraphShare
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save to My Graph
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, da]
        MGAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ShareExtension/MyGraphShare.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]

  MyGraphWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
      - path: MyGraph/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).widget
        PRODUCT_NAME: MyGraphWidget
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: My Graph
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, da]
        MGAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/MyGraphWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]

  # Taps driven against a running server (see README.md, "UI tests").
  MyGraphUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).uitests
        TEST_TARGET_NAME: MyGraph
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MyGraph

schemes:
  MyGraph:
    build:
      targets:
        MyGraph: all
        MyGraphShare: all
        MyGraphWidget: all
        MyGraphUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MyGraphUITests
    archive:
      config: Release
