name: MyGraphMac
options:
  bundleIdPrefix: app.mygraph
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

# Change these for your Apple Developer account (see README.md, "Distribution").
settings:
  base:
    BUNDLE_ID: app.mygraph.mac
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Local builds are signed ad hoc; a Developer ID build sets CODE_SIGN_IDENTITY and DEVELOPMENT_TEAM (README.md).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  # The menu bar app. Shares the iOS app's API client, models, chat, import shapes and strings (ios/Shared and two
  # files of ios/MyGraph) as sources: nothing is copied, and the iOS project is unchanged.
  MyGraphMac:
    type: application
    platform: macOS
    sources:
      - path: MyGraphMac
      - path: ../ios/Shared/API.swift
        group: Shared
      - path: ../ios/Shared/AppGroup.swift
        group: Shared
      - path: ../ios/Shared/AppLanguage.swift
        group: Shared
      - path: ../ios/Shared/CookieVault.swift
        group: Shared
      - path: ../ios/Shared/Models.swift
        group: Shared
      - path: ../ios/Shared/PushPayload.swift
        group: Shared
      - path: ../ios/Shared/Route.swift
        group: Shared
      - path: ../ios/Shared/SSE.swift
        group: Shared
      - path: ../ios/Shared/SendKit.swift
        group: Shared
      - path: ../ios/Shared/Localizable.xcstrings
        group: Shared
      - path: ../ios/MyGraph/FromPhone/PhoneImportKit.swift
        group: Shared
      - path: ../ios/MyGraph/FromPhone/ContactsSource.swift
        group: Shared
      - path: ../ios/MyGraph/Ask/ChatModel.swift
        group: Shared
      - path: ../ios/MyGraph/Auth/PasskeySignIn.swift
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        PRODUCT_NAME: My Graph
        PRODUCT_MODULE_NAME: MyGraphMac
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        OTHER_LDFLAGS: [-lsqlite3]
    info:
      path: MyGraphMac/Info.plist
      properties:
        CFBundleDisplayName: My Graph
        CFBundleName: My Graph
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, da]
        CFBundleAllowMixedLocalizations: true
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        # A menu bar app: no Dock icon, no main menu.
        LSUIElement: true
        NSHumanReadableCopyright: My Graph
        # Not a group container: macOS asks a person before an unsigned app touches a "group." container, and the Mac
        # app has nothing to share with an extension. UserDefaults uses this suite (see Platform/MacPlatform.swift).
        MGAppGroup: $(BUNDLE_ID).shared
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSContactsUsageDescription: Send your contacts (names, numbers, addresses, birthdays and related names) to My Graph, where you review what it finds before anything is added.
        NSCalendarsFullAccessUsageDescription: Send the events in your calendars (30 days back, 120 ahead) to My Graph for you to review, and keep a "My Graph" calendar with the events you approved.
        NSCalendarsWriteOnlyAccessUsageDescription: Keep a "My Graph" calendar with the events you approved in My Graph.
        NSRemindersFullAccessUsageDescription: Send your reminders to My Graph for you to review, and keep a "My Graph" list with the reminders you approved there.
        NSPhotoLibraryUsageDescription: Send the details of your photos (when and where they were taken, albums, favourites), only if you turn this on in My Graph's settings.
        NSAppleEventsUsageDescription: Read your notes in Notes as plain text, only the folders you choose, so My Graph can suggest what to add. Nothing is added until you approve it.
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID)
            CFBundleURLSchemes: [mygraph-mac]
    entitlements:
      path: MyGraphMac/MyGraphMac.entitlements
      properties:
        # Hardened runtime exceptions for what TCC guards. No App Sandbox: Messages, Call History and Voice Memos
        # live behind Full Disk Access, which a sandboxed app can't use.
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.photos-library: true

  # Pure logic (no app host): attributedBody, Apple dates, call records, batching, file versions, outbox plans.
  MyGraphMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: MyGraphMac/Core
      - path: ../ios/MyGraph/FromPhone/PhoneImportKit.swift
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: [-lsqlite3]

schemes:
  MyGraphMac:
    build:
      targets:
        MyGraphMac: all
        MyGraphMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MyGraphMacTests
    archive:
      config: Release
